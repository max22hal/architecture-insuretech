apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaletestapp-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scaletestapp-app
  template:
    metadata:
      labels:
        app: scaletestapp-app
    spec:
      containers:
      - name: scaletestapp-app-identifier
        image: shestera/scaletestapp
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "15Mi"
          limits:
            memory: "30Mi"
